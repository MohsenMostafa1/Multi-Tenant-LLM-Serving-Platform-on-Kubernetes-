# k8s/worker-llama.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-llama
  namespace: llm-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-llama
  template:
    metadata:
      labels:
        app: llm-llama
    spec:
      containers:
      - name: vllm
        image: llm-worker:latest  # or your registry image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_NAME
          value: "meta-llama/Llama-3.2-1B"   # Smaller model for demo
        - name: MAX_MODEL_LEN
          value: "4096"
        - name: GPU_MEMORY_UTIL
          value: "0.9"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: "4Gi"
            cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: svc-llama
  namespace: llm-platform
spec:
  selector:
    app: llm-llama
  ports:
  - port: 8000
    targetPort: 8000
